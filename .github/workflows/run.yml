name: Bot MyMuze Diário às 05:00

on:
  schedule:
    # Executa todos os dias às 03:00 UTC (que corresponde a 05:00 da manhã em Moçambique)
    - cron: '0 3 * * *'
  workflow_dispatch: # Permite clicar no botão "Run workflow" manualmente para testar a qualquer momento

jobs:
  run-mymuze-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Aceder ao Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências e Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Executar o Bot
        run: python bot.py
