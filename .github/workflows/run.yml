name: Bot MyMuze Cloud

on:
  schedule:
    # Executa automaticamente todos os dias (pode ajustar a hora se quiser)
    - cron: '0 8 * * *'
  workflow_dispatch: # Permite executar manualmente a qualquer momento pelo site do GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Aceder ao repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          pip install playwright
          playwright install chromium

      - name: Executar o Bot MyMuze
        env:
          COOKIE_CONTA_1: ${{ secrets.COOKIE_CONTA_1 }}
          COOKIE_CONTA_2: ${{ secrets.COOKIE_CONTA_2 }}
        run: |
          python bot.py
          
