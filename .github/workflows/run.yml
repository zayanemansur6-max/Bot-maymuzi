name: Bot MyMuze Diário

on:
  workflow_dispatch:

jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restaurar sessões
        uses: actions/cache@v5
        with:
          path: sessoes
          key: sessoes-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sessoes-

      - name: Instalar Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Rodar bot
        run: python -u bot.py

      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: capturas-ecra
          path: captura_*.png
          if-no-files-found: ignore
